<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AR Clock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: one manga panel filling the phone screen, showing the camera through a filter; every 10 seconds a flat time card wipes across. All controls live in a sheet that slides up from the bottom. Single black-and-white look by design. */
:root{
  --paper:#f6f4ee; --ink:#101012; --mute:#66666c;
  --font-d:'Archivo','Helvetica Neue',Arial,sans-serif;
  --font-u:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-u); font-weight:700; font-size:14px; overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; -webkit-text-size-adjust:100%;
}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%)}

/* 画面いっぱいのコマ。余白はノッチやホームバーの分だけ取る */
.app{position:fixed; inset:0; display:flex; background:var(--ink)}
@supports (height:100dvh){ .app{bottom:auto; height:100dvh} }
.stage{position:relative; flex:1 1 auto; min-width:0; min-height:0; background:var(--ink); overflow:hidden}
#gl{position:absolute; inset:0; width:100%; height:100%; display:block}
#vid{position:absolute; left:0; top:0; width:2px; height:2px; opacity:0; pointer-events:none}
/* 場所と日付は文字だけを映像に直に載せる。下の映像と反転して重なるので、明るい所でも暗い所でも読める */
.tag{position:absolute; z-index:1; color:#fff; mix-blend-mode:difference; pointer-events:none;
  font-family:var(--font-d); font-weight:800; font-size:12px; letter-spacing:.18em; font-variant-numeric:tabular-nums}
.tag.tl{left:max(16px,var(--sl)); top:calc(var(--st) + 22px)} .tag.br{right:max(16px,var(--sr)); bottom:calc(var(--sb) + 18px)}
.hint{position:absolute; z-index:1; left:max(12px,var(--sl)); bottom:calc(var(--sb) + 12px); pointer-events:none; font-size:12px; padding:7px 12px}

button, label.btn{
  font:inherit; font-size:14px; color:var(--ink); background:var(--paper); margin:0;
  border:2px solid var(--ink); border-radius:0; padding:10px 14px; min-height:44px; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; text-align:center;
}
button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
button:focus-visible, input:focus-visible, label.btn:focus-within{outline:2px dashed var(--ink); outline-offset:3px}

.start{position:absolute; z-index:2; left:50%; top:50%; transform:translate(-50%,-50%); width:min(320px,calc(100% - 32px));
  background:var(--paper); border:3px solid var(--ink); box-shadow:6px 6px 0 var(--ink); padding:18px; display:flex; flex-direction:column; gap:10px}
.start h2{margin:0; font-family:var(--font-d); font-weight:800; font-size:22px; letter-spacing:.08em}
.start p{margin:0; font-size:13px; font-weight:500; line-height:1.6}
.start .err{font-weight:700}
.start .err:empty{display:none}
.start button, .start label.btn{width:100%}
.start .primary{background:var(--ink); color:var(--paper)}

.card{position:fixed; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  background:var(--paper); color:var(--ink); pointer-events:none; padding-inline:16px; text-align:center;
  -webkit-clip-path:inset(0 100% 0 0); clip-path:inset(0 100% 0 0)}
.card.inv{background:var(--ink); color:var(--paper)}
.card.in{-webkit-clip-path:inset(0 0 0 0); clip-path:inset(0 0 0 0); transition:clip-path .55s cubic-bezier(.7,0,.2,1), -webkit-clip-path .55s cubic-bezier(.7,0,.2,1)}
.card.out{-webkit-clip-path:inset(0 0 0 100%); clip-path:inset(0 0 0 100%); transition:clip-path .55s cubic-bezier(.7,0,.2,1), -webkit-clip-path .55s cubic-bezier(.7,0,.2,1)}
.time{font-family:var(--font-d); font-weight:800; font-size:clamp(44px,15vw,84px); letter-spacing:.05em; line-height:1; font-variant-numeric:tabular-nums}
.sub{font-family:var(--font-d); font-weight:600; font-size:12px; letter-spacing:.26em; text-indent:.26em}
.sub.dimmed{opacity:.55; letter-spacing:.2em}

/* 設定ボタン：右上に1つだけ。しばらく触らないと薄くなる */
/* 設定ボタン：つかんで動かせる。離すといちばん近い角に吸い付く */
#menu[data-c="tr"]{top:calc(var(--st) + 10px); right:max(12px,var(--sr))} #menu[data-c="tl"]{top:calc(var(--st) + 10px); left:max(12px,var(--sl))}
#menu[data-c="br"]{bottom:calc(var(--sb) + 14px); right:max(12px,var(--sr))} #menu[data-c="bl"]{bottom:calc(var(--sb) + 14px); left:max(12px,var(--sl))}
#menu{position:fixed; z-index:5; width:44px; height:44px; padding:0; touch-action:none; cursor:grab;
  min-height:44px; padding:8px 14px; font-family:var(--font-d); font-weight:800; font-size:12px; letter-spacing:.14em; transition:opacity .6s}
.dim #menu{opacity:.4}

/* 下からせり上がるシート */
.shade{position:fixed; inset:0; z-index:6; cursor:pointer; background:transparent; opacity:0; visibility:hidden; transition:opacity .25s, visibility 0s .25s}
.shade.open{opacity:1; visibility:visible; transition:opacity .25s}
.sheet{position:fixed; z-index:7; left:0; right:0; bottom:0; max-height:82%; display:flex; flex-direction:column;
  background:rgba(246,244,238,.5); border-top:3px solid var(--ink); transform:translateY(102%); visibility:hidden;
  transition:transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s .3s}
@supports (height:100dvh){ .sheet{bottom:auto; top:100dvh; max-height:82dvh; transform:translateY(2%)} .sheet.open{transform:translateY(-100%)} }
.sheet.open{visibility:visible; transition:transform .3s cubic-bezier(.2,.8,.2,1)}
@supports not (height:100dvh){ .sheet.open{transform:none} }
.sheet-head{background:var(--paper); flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px max(16px,var(--sr)) 10px max(16px,var(--sl)); border-bottom:2px solid var(--ink)}
.sheet-head h2{margin:0; font-family:var(--font-d); font-weight:800; font-size:14px; letter-spacing:.16em}
.sheet-body{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:18px;
  padding:16px max(16px,var(--sr)) calc(max(16px,var(--sb)) + 28px) max(16px,var(--sl))}
.grp{display:flex; flex-direction:column; gap:8px; min-width:0}
/* シートは半透明。下の映像が見えるので、文字と操作部だけ紙色の地を敷く */
.grp h3, .note, .lab{align-self:flex-start; background:var(--paper); padding:2px 6px}
.grp h3{margin:0; font-family:var(--font-d); font-weight:600; font-size:11px; letter-spacing:.14em}
.lab{font-size:12px; font-weight:700}
.slide{display:flex; align-items:center; gap:10px; background:var(--paper); border:2px solid var(--ink); padding:0 12px; font-size:12px}
.slide input{flex:1 1 auto; min-width:0}
.toast{position:fixed; z-index:8; left:50%; top:calc(var(--st) + 66px); transform:translate(-50%,-6px); max-width:calc(100% - 48px);
  background:var(--ink); color:var(--paper); padding:8px 14px; font-size:13px; letter-spacing:.06em; text-align:center; pointer-events:none;
  opacity:0; transition:opacity .25s, transform .25s}
.toast.show{opacity:1; transform:translate(-50%,0)}
.seg{display:flex; flex-wrap:wrap; gap:8px}
.seg.two > *{flex:1 1 0}
.note{margin:0; font-size:12px; font-weight:500; color:var(--mute); line-height:1.5}
input[type=range]{width:100%; height:36px; margin:0; accent-color:var(--ink)}
/* ガラス調のUI：半透明の面（ぼかし入り）の上に、半透明の操作部を重ねる */
:root{ --glass:rgba(24,24,28,.5); --glass-2:rgba(255,255,255,.15); --glass-line:rgba(255,255,255,.24); --on:#fff }
.sheet, .start, #menu, .toast, .hint{ background:var(--glass); color:var(--on); border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(18px) saturate(1.6); backdrop-filter:blur(18px) saturate(1.6); box-shadow:0 10px 40px rgba(0,0,0,.3) }
.sheet{ border-width:1px 0 0; border-radius:28px 28px 0 0 }
.sheet-head{ background:transparent; border-bottom:1px solid var(--glass-line) }
.start{ border-radius:28px }
#menu, .toast, .hint{ border-radius:999px }
.sheet button, .sheet label.btn, .start button, .start label.btn{ background:var(--glass-2); color:var(--on); border:1px solid var(--glass-line); border-radius:16px }
.sheet button[aria-pressed="true"], .start .primary{ background:rgba(255,255,255,.9); color:#111; border-color:transparent }
.grp h3, .note, .lab{ background:transparent; padding:0; color:rgba(255,255,255,.82) }
.slide{ background:var(--glass-2); border:1px solid var(--glass-line); border-radius:16px; color:var(--on) }
.sheet input[type=range]{ accent-color:#fff }
.sheet button:focus-visible, .start button:focus-visible, #menu:focus-visible, .sheet input:focus-visible{ outline-color:#fff }
.seg.three{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)) }
.seg.three button{ padding:10px 4px; font-size:13px }
@media (prefers-reduced-motion: reduce){ .card.in,.card.out,.sheet,.sheet.open,.shade,.shade.open,.toast{transition:none} }
</style>

</head>
<body>
<h1 class="sr" id="srtime">AR Clock</h1>
<input type="file" id="file" class="sr" accept="image/*,video/*" tabindex="-1">

<div class="app">
  <main class="stage" id="stage">
    <canvas id="gl" data-i18n-label="canvas"></canvas>
    <video id="vid" playsinline muted loop></video>
    <div class="tag tl" id="tagPlace" hidden></div>
    <div class="tag br" id="tagDate" hidden></div>
    <div class="hint" id="tagSrc" hidden></div>
    <div class="start" id="start">
      <h2>AR CLOCK</h2>
      <p data-i18n="desc"></p>
      <button type="button" id="camStart" class="primary" data-i18n="cam"></button>
      <label class="btn" for="file" data-i18n="pick"></label>
      <button type="button" id="demoStart" data-i18n="demo"></button>
      <p class="err" id="msg" role="status"></p>
    </div>
    <div class="start" id="ask" hidden>
      <h2 data-i18n="askT"></h2>
      <p data-i18n="askD"></p>
      <button type="button" id="soundYes" class="primary" data-i18n="yes"></button>
      <button type="button" id="soundNo" data-i18n="no"></button>
    </div>
  </main>
</div>

<div class="card" id="cardA"><div class="time ctime">-- -- --</div><div class="sub csub"></div><div class="sub dimmed cmood"></div></div>
<div class="card" id="cardB"><div class="time ctime">-- -- --</div><div class="sub csub"></div><div class="sub dimmed cmood"></div></div>

<button type="button" id="menu" data-c="tr" data-i18n-label="settings" aria-expanded="false" aria-controls="sheet"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" d="M19.15 10.08 L21.88 10.44 L21.88 13.56 L19.15 13.92 L18.41 15.70 L20.09 17.88 L17.88 20.09 L15.70 18.41 L13.92 19.15 L13.56 21.88 L10.44 21.88 L10.08 19.15 L8.30 18.41 L6.12 20.09 L3.91 17.88 L5.59 15.70 L4.85 13.92 L2.12 13.56 L2.12 10.44 L4.85 10.08 L5.59 8.30 L3.91 6.12 L6.12 3.91 L8.30 5.59 L10.08 4.85 L10.44 2.12 L13.56 2.12 L13.92 4.85 L15.70 5.59 L17.88 3.91 L20.09 6.12 L18.41 8.30Z M12 8.3a3.7 3.7 0 1 0 0 7.4a3.7 3.7 0 1 0 0-7.4Z"/></svg></button>
<div class="toast" id="toast" role="status"></div>
<div class="shade" id="shade"></div>
<section class="sheet" id="sheet" data-i18n-label="settings">
  <div class="sheet-head"><h2 data-i18n="settings"></h2><button type="button" id="close" data-i18n="close"></button></div>
  <div class="sheet-body">
    <div class="grp">
      <h3 data-i18n="gSound"></h3>
      <div class="seg two">
        <button type="button" id="play"></button>
        <button type="button" id="chime" aria-pressed="false"></button>
      </div>
    </div>
    <div class="grp">
      <h3 data-i18n="gBase"></h3>
      <div class="seg two" id="segBase">
        <button type="button" id="base-color" data-v="color" data-i18n="color"></button>
        <button type="button" id="base-mono" data-v="mono" data-i18n="mono"></button>
      </div>
      <label class="lab" for="monoTone" data-i18n="monoTone"></label>
      <div class="slide"><span data-i18n="light"></span><input type="range" id="monoTone" min="0" max="1" step="0.01"><span data-i18n="dark"></span></div>
    </div>
    <div class="grp">
      <h3 data-i18n="gLook"></h3>
      <div class="seg" id="segLook">
        <button type="button" id="look-none" data-v="none" data-i18n="none"></button>
        <button type="button" id="look-film" data-v="film" data-i18n="film"></button>
        <button type="button" id="look-vivid" data-v="vivid" data-i18n="vivid"></button>
        <button type="button" id="look-manga" data-v="manga" data-i18n="manga"></button>
        <button type="button" id="look-pop" data-v="pop" data-i18n="pop"></button>
        <button type="button" id="look-mini" data-v="mini" data-i18n="mini"></button>
        <button type="button" id="look-fish" data-v="fish" data-i18n="fish"></button>
      </div>
      <label class="lab" for="lineW" data-i18n="lineW"></label>
      <div class="slide"><span data-i18n="thin"></span><input type="range" id="lineW" min="0" max="1" step="0.01"><span data-i18n="thick"></span></div>
    </div>
    <div class="grp">
      <h3 data-i18n="gFx"></h3>
      <div class="seg">
        <button type="button" id="fxGlitch" aria-pressed="false"></button>
      </div>
      <p class="note" data-i18n="fxNote"></p>
    </div>
    <div class="grp">
      <h3 data-i18n="gView"></h3>
      <div class="seg">
        <button type="button" id="labelsBtn" aria-pressed="false"></button>
      </div>
      <p class="note" data-i18n="locNote"></p>
    </div>
    <div class="grp">
      <h3 data-i18n="gSrc"></h3>
      <div class="seg" id="segSrc">
        <button type="button" id="src-env" data-v="environment" data-i18n="camBack"></button>
        <button type="button" id="src-user" data-v="user" data-i18n="camFront"></button>
        <label class="btn" for="file" data-i18n="pick"></label>
      </div>
    </div>
    <div class="grp">
      <h3 data-i18n="gStyle"></h3>
      <div class="seg three" id="segStyle">
        <button type="button" id="st-piano" data-v="piano" data-i18n="piano"></button>
        <button type="button" id="st-electro" data-v="electro" data-i18n="electro"></button>
        <button type="button" id="st-musicbox" data-v="musicbox" data-i18n="musicbox"></button>
        <button type="button" id="st-birds" data-v="birds" data-i18n="birds"></button>
        <button type="button" id="st-chip" data-v="chip" data-i18n="chip"></button>
        <button type="button" id="st-lofi" data-v="lofi" data-i18n="lofi"></button>
        <button type="button" id="st-whistle" data-v="whistle" data-i18n="whistle"></button>
        <button type="button" id="st-jazz" data-v="jazz" data-i18n="jazz"></button>
        <button type="button" id="st-country" data-v="country" data-i18n="country"></button>
        <button type="button" id="st-forest" data-v="forest" data-i18n="forest"></button>
      </div>
    </div>
    <div class="grp">
      <h3 data-i18n="gMood"></h3>
      <div class="seg" id="segMood">
        <button type="button" id="md-auto" data-v="auto" data-i18n="auto"></button>
        <button type="button" id="md-morning" data-v="morning" data-i18n="morning"></button>
        <button type="button" id="md-day" data-v="day" data-i18n="day"></button>
        <button type="button" id="md-evening" data-v="evening" data-i18n="evening"></button>
        <button type="button" id="md-night" data-v="night" data-i18n="night"></button>
      </div>
      <p class="note" data-i18n="moodNote"></p>
    </div>
    <div class="grp">
      <h3><label for="vol" data-i18n="gVol"></label></h3>
      <div class="slide"><input type="range" id="vol" min="0" max="1" step="0.01"></div>
    </div>
    <div class="grp">
      <h3 data-i18n="gLang"></h3>
      <div class="seg two" id="segLang">
        <button type="button" id="lang-en" data-v="en" lang="en">English</button>
        <button type="button" id="lang-ja" data-v="ja" lang="ja">日本語</button>
      </div>
    </div>
  </div>
</section>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('arclock.' + k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('arclock.' + k, v); }catch(e){} }
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pick = a => a[Math.random() * a.length | 0];

const state = {
  style: store.get('style', 'piano'),
  mood: store.get('mood', 'auto'),
  chime: store.get('chime', '1') === '1',
  vol: Math.min(1, Math.max(0, parseFloat(store.get('vol', '0.7')) || 0))
};

/* ───────────── 音：その場で生成するエンドレスBGM ───────────── */
const MOODS = {
  morning:{ label:'MORNING', key:62, bpm:126, cut:11000, drums:2, oct:12, send:.16,
    prog:[[0,'M'],[7,'M'],[9,'m7'],[5,'M7'],[0,'M'],[4,'m7'],[5,'M7'],[7,'sus']] },
  day:{ label:'DAYTIME', key:55, bpm:118, cut:8500, drums:2, oct:12, send:.18,
    prog:[[5,'M7'],[7,'M'],[4,'m7'],[9,'m'],[5,'M7'],[7,'M'],[0,'M'],[0,'M7']] },
  evening:{ label:'EVENING', key:57, bpm:100, cut:4200, drums:1, oct:0, send:.24,
    prog:[[9,'m7'],[5,'M7'],[0,'M7'],[7,'M'],[9,'m7'],[5,'M7'],[2,'m7'],[7,'sus']] },
  night:{ label:'NIGHT', key:64, bpm:76, cut:1900, drums:0, oct:0, send:.32,
    prog:[[0,'M7'],[9,'m7'],[5,'M7'],[7,'sus'],[2,'m7'],[7,'7'],[0,'M7'],[0,'M7']] }
};
// 時報の高さは固定：短い音は約2kHz、長い音は約1kHz（UNIQLOCKの動画の実測）。正確にはシの音（1975.5Hz / 987.8Hz）に置く。
// 各時間帯の調は、シが必ず音階に含まれるもの（朝=ニ長調、昼=ト長調、夕=イ長調、夜=ホ長調）にして、曲と濁らないようにしている
const TONE_PIP = 1975.53, TONE_LONG = 987.77;
const STYLES = {
  piano:{ label:'ピアノ', tempo:1 }, electro:{ label:'エレクトロ', tempo:1.04 },
  musicbox:{ label:'オルゴール', tempo:.8 }, lofi:{ label:'ローファイ', tempo:.82 },
  chip:{ label:'8bit', tempo:1.06 }, birds:{ label:'鳥のさえずり', tempo:.7 },
  whistle:{ label:'口笛', tempo:.9 }, jazz:{ label:'ジャズ', tempo:1 }, country:{ label:'田舎のさえずり', tempo:.7 }, forest:{ label:'森のさえずり', tempo:.7 }
};
if (!STYLES[state.style]) state.style = 'piano';
if (state.mood !== 'auto' && !MOODS[state.mood]) state.mood = 'auto';
const CH = { M:[0,4,7], m:[0,3,7], M7:[0,4,7,11], m7:[0,3,7,10], sus:[0,5,7], '7':[0,4,7,10] };
const PENTA = [0,2,4,7,9,12,14,16,19,21];
const ARPS = [
  [0,1,2,3,2,1,2,3,0,1,2,4,2,1,2,3],
  [0,2,1,3,2,4,3,2,0,2,1,3,2,4,5,4],
  [0,1,2,0,1,2,3,1,2,3,4,2,3,2,1,0],
  [3,2,1,0,3,2,1,0,4,3,2,1,4,3,2,1]
];
const STABS = ['x..x..x.x..x..x.', 'x.x...x.x.x...x.', 'x..x.x..x..x.x..', '..x...x...x..x..'];

const autoMood = h => h >= 5 && h < 10 ? 'morning' : h < 17 && h >= 10 ? 'day' : h >= 17 && h < 22 ? 'evening' : 'night';
const currentMood = () => state.mood === 'auto' ? autoMood(new Date().getHours()) : state.mood;
const mf = m => 440 * Math.pow(2, (m - 69) / 12);

const A = { ctx:null, playing:false, timer:null };
const S = { step:0, bar:0, next:0, P:null, motif:null, beatRef:0, dirty:true };

function initAudio(){
  if (A.ctx){ if (A.ctx.state !== 'running') A.ctx.resume().catch(() => {}); return true; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  const c = A.ctx = new AC(); OFF.length = 0;
  A.out = c.createGain(); A.out.gain.value = state.vol;
  A.comp = c.createDynamicsCompressor(); A.comp.threshold.value = -14; A.comp.ratio.value = 4;
  A.comp.connect(A.out); A.out.connect(c.destination);
  A.music = c.createGain(); A.music.gain.value = 0;
  A.lp = c.createBiquadFilter(); A.lp.type = 'lowpass'; A.lp.frequency.value = 8000; A.lp.Q.value = .3;
  A.music.connect(A.lp); A.lp.connect(A.comp);

  A.delay = c.createDelay(1.5); A.delay.delayTime.value = .38;
  A.fb = c.createGain(); A.fb.gain.value = .34;
  A.dlp = c.createBiquadFilter(); A.dlp.type = 'lowpass'; A.dlp.frequency.value = 2400;
  A.send.connect(A.delay); A.delay.connect(A.dlp); A.dlp.connect(A.fb); A.fb.connect(A.delay); A.dlp.connect(A.music);
  const n = c.sampleRate, buf = c.createBuffer(1, n, n), d = buf.getChannelData(0);

function osc(type, f, t, a, d, peak, wet, dest){

  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(peak, .0002), t + a);
  g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
  o.connect(g); g.connect(dest || A.music); if (wet) g.connect(A.send);
  o.start(t); o.stop(t + a + d + .05);
}
function noise(t, d, v, type, freq, q){
  const c = A.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = A.nbuf; f.type = type; f.frequency.value = freq; f.Q.value = q || .7;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f); f.connect(g); g.connect(A.music);
  s.start(t, Math.random() * .5); s.stop(t + d + .02);
}
function kick(t, v){
  const c = A.ctx, o = c.createOscillator(), g = c.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(46, t + .11);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
  o.connect(g); g.connect(A.music); o.start(t); o.stop(t + .32);
}
const hat = (t, v) => noise(t, .035, v, 'highpass', 7500);
const rim = (t, v) => { noise(t, .03, v, 'bandpass', 2200, 3); osc('triangle', 900, t, .001, .03, v * .5); };
const clap = (t, v) => noise(t, .11, v, 'bandpass', 1500, 1.2);
const snare = (t, v) => { noise(t, .14, v, 'bandpass', 1900, .8); osc('triangle', 190, t, .001, .08, v * .6); };
const bass = (m, t, v, d) => { const f = mf(m); osc('triangle', f, t, .008, d, v); osc('sine', f, t, .008, d, v * .6); };
const piano = (m, t, v, d) => { const f = mf(m); osc('triangle', f, t, .004, d, v, true); osc('sine', f * 2, t, .004, d * .4, v * .3); osc('sine', f * 1.004, t, .004, d, v * .5); };
const bell = (m, t, v) => { const f = mf(m); osc('sine', f, t, .003, 1.6, v, true); osc('sine', f * 3.01, t, .003, .35, v * .22); osc('sine', f * 5.4, t, .002, .12, v * .1); };
function pluck(m, t, v){
  const c = A.ctx, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
  o.type = 'sawtooth'; o.frequency.value = mf(m); f.type = 'lowpass'; f.Q.value = 4;
  f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(350, t + .18);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + .22);
  o.connect(f); f.connect(g); g.connect(A.music); g.connect(A.send); o.start(t); o.stop(t + .25);
}
function epiano(m, t, v, d){
  const c = A.ctx, f = mf(m), car = c.createOscillator(), mod = c.createOscillator(), mg = c.createGain(), g = c.createGain();
  car.frequency.value = f; mod.frequency.value = f;
  mg.gain.setValueAtTime(f * 1.6, t); mg.gain.exponentialRampToValueAtTime(f * .15, t + .5);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  mod.connect(mg); mg.connect(car.frequency); car.connect(g); g.connect(A.music); g.connect(A.send);
  car.start(t); mod.start(t); car.stop(t + d + .05); mod.stop(t + d + .05);
}

// 鳥のさえずり：高い正弦波を短く上下させた音を数個つなげる
function bird(t, v){
  const c = A.ctx, n = 2 + (Math.random() * 5 | 0), f0 = 2300 + Math.random() * 2400, up = Math.random() < .55; let tt = t;
  for (let i = 0; i < n; i++){
    const o = c.createOscillator(), g = c.createGain(), d = .04 + Math.random() * .09;
    const fa = f0 * (1 + (Math.random() - .5) * .3), fb = fa * (up ? 1.2 + Math.random() * .4 : .72 + Math.random() * .1);
    o.frequency.setValueAtTime(fa, tt); o.frequency.exponentialRampToValueAtTime(fb, tt + d);
    g.gain.setValueAtTime(.0001, tt); g.gain.exponentialRampToValueAtTime(v, tt + d * .3); g.gain.exponentialRampToValueAtTime(.0001, tt + d);
    o.connect(g); g.connect(A.music); g.connect(A.send); o.start(tt); o.stop(tt + d + .02);
    tt += d + .015 + Math.random() * .06;
  }
}
const AMBIENT = { birds:1, country:1, forest:1 };
// フクロウ：低い「ホッ、ホー、ホー」
function owl(t, v){
  const c = A.ctx; [[0, .16], [.34, .42], [.92, .5]].forEach(([dt, d], i) => {
    const o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), g2 = c.createGain(), f = 372 - i * 8, tt = t + dt;
    o.frequency.setValueAtTime(f * 1.04, tt); o.frequency.exponentialRampToValueAtTime(f * .93, tt + d);
    o2.frequency.setValueAtTime(f * 2.08, tt); o2.frequency.exponentialRampToValueAtTime(f * 1.86, tt + d);
    g.gain.setValueAtTime(.0001, tt); g.gain.exponentialRampToValueAtTime(v, tt + .05); g.gain.setValueAtTime(v, tt + d * .6); g.gain.exponentialRampToValueAtTime(.0001, tt + d);
    g2.gain.value = .12; o.connect(g); o2.connect(g2); g2.connect(g); g.connect(A.music); g.connect(A.send);
    o.start(tt); o2.start(tt); o.stop(tt + d + .03); o2.stop(tt + d + .03);
  });
}
// カエル：短い矩形波をつなげた「ケロ、ケロケロ」。低めの組と高めの組
function frog(t, v){
  const f = 300 + Math.random() * 320, n1 = 4 + (Math.random() * 3 | 0), reps = 1 + (Math.random() * 3 | 0); let tt = t;
  for (let r = 0; r < reps; r++){
    for (let i = 0; i < n1; i++) osc('square', f * (1 + i * .03), tt + i * .03, .002, .024, v * .5);
    tt += n1 * .03 + .05;
    for (let i = 0; i < n1 + 2; i++) osc('square', f * 1.5 * (1 + i * .02), tt + i * .028, .002, .022, v * .42);
    tt += (n1 + 2) * .028 + .16 + Math.random() * .2;
  }
}
// コオロギ：高い音を3つずつ「リリリ、リリリ」
function cricket(t, v){
  const f = 4100 + Math.random() * 900, reps = 2 + (Math.random() * 4 | 0); let tt = t;
  for (let r = 0; r < reps; r++){ for (let i = 0; i < 3; i++) osc('sine', f, tt + i * .042, .004, .03, v); tt += .3 + Math.random() * .08; }
}
// スズムシ：細かく震える「リーン、リーン」
function suzu(t, v){
  const c = A.ctx, f = 3800 + Math.random() * 500;
  for (let r = 0; r < 2; r++){
    const tt = t + r * 1.05, o = c.createOscillator(), l = c.createOscillator(), lg = c.createGain(), am = c.createGain(), g = c.createGain();
    o.frequency.value = f; l.frequency.value = 18 + Math.random() * 6; lg.gain.value = .5; am.gain.value = .5;
    l.connect(lg); lg.connect(am.gain); o.connect(am); am.connect(g);
    g.gain.setValueAtTime(.0001, tt); g.gain.exponentialRampToValueAtTime(v, tt + .2); g.gain.setValueAtTime(v, tt + .55); g.gain.exponentialRampToValueAtTime(.0001, tt + .9);
    g.connect(A.music); g.connect(A.send); o.start(tt); l.start(tt); o.stop(tt + .95); l.stop(tt + .95);
  }
}
// 口笛：ゆれのある正弦波に、少しだけ息の音を混ぜる
function whistle(m, t, d, v){
  const c = A.ctx, f = mf(m), o = c.createOscillator(), l = c.createOscillator(), lg = c.createGain(), g = c.createGain();
  o.frequency.setValueAtTime(f * .955, t); o.frequency.exponentialRampToValueAtTime(f, t + .07);
  l.frequency.value = 5.6; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * .011, t + Math.min(d, .35));
  l.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .05); g.gain.setValueAtTime(v, t + d * .7); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(A.music); g.connect(A.send); o.start(t); l.start(t); o.stop(t + d + .03); l.stop(t + d + .03);

function newMotif(){
  const r = [], c = []; let i = 2 + (Math.random() * 3 | 0);
  for (let k = 0; k < 8; k++){
    r.push(k === 0 || Math.random() < .6);
    i = Math.max(0, Math.min(7, i + pick([-2,-1,-1,0,1,1,2])));
    c.push(i);
  }
  S.motif = { r, c, arp:pick(ARPS), stab:pick(STABS), fill:Math.random() < .5 };
}
function mutateMotif(){
  const M = S.motif;
  for (let n = 0; n < 2; n++){
    const k = 1 + (Math.random() * 7 | 0);
    M.r[k] = Math.random() < .6;
    M.c[k] = Math.max(0, Math.min(7, M.c[k] + pick([-1, 1, 2, -2])));
  }
  if (Math.random() < .4) M.stab = pick(STABS);
  if (Math.random() < .4) M.arp = pick(ARPS);

}
function params(){
  const mood = currentMood(), M = MOODS[mood];
  return { mood, style:state.style, key:M.key, bpm:qbpm(mood),
    cut:M.cut, drums:M.drums, oct:M.oct, send:M.send, prog:M.prog };
}
function applyParams(t){
  const np = params(), old = S.P;
  S.P = np; S.beatRef = t; S.dirty = false;
  A.lp.frequency.setTargetAtTime(AMBIENT[np.style] ? Math.max(np.cut, 9000) : np.style === 'whistle' ? Math.max(np.cut, 5000) : np.style === 'chip' ? Math.max(np.cut, 3200) : np.cut, t, .25);
  A.send.gain.setTargetAtTime(np.send, t, .25);
  A.delay.delayTime.setTargetAtTime(60 / np.bpm * .75, t, .2);
  if (!old || old.style !== np.style || !S.motif) newMotif();

}
function scheduleStep(s, t){
  const P = S.P, M = S.motif, ch = P.prog[S.bar % P.prog.length], root = P.key + ch[0], tones = CH[ch[1]];
  const sd = 60 / P.bpm / 4, e = s % 2 === 0, q = s % 4 === 0, h = s >> 1;
  const voice = n => { n += root; while (n > P.key + 8) n -= 12; while (n < P.key - 5) n += 12; return n; };
  let b = root - 12; while (b > 50) b -= 12;
  const ci = S.bar % 4 === 3 ? M.c[7 - h] : M.c[h];
  const mel = i => P.key + P.oct + PENTA[i];
  const D = P.drums;
  // 時報：秒の頭に来る刻みで鳴らす。高さは常に同じ（シの音）。曲のほうを、シが濁らない調にしてある
  if (state.chime && running && S.abs % (P.bpm / 15) === 0){
    if (Math.round(S.abs / (P.bpm / 15)) % 10 === 0) pong(TONE_LONG, t); else pip(TONE_PIP, .05, .22, t);
  }

  if (P.style === 'piano'){
    if (s === 0) bass(b, t, .26, .5);
    if (s === 8 && D > 0) bass(b, t, .18, .35);
    if (s === 14 && D > 1) bass(b + 7, t, .14, .2);
    if (M.stab[s] === 'x') tones.forEach(n => piano(voice(n), t, .055, .45));
    if (e && M.r[h]) piano(mel(ci), t, .15, D ? .7 : 1.4);
    if (D > 1){ if (q) kick(t, .5); if (s % 4 === 2) hat(t, .05); if (s === 4 || s === 12) rim(t, .12); }
    else if (D === 1){ if (s === 0 || s === 8) kick(t, .35); if (s === 12) rim(t, .08); if (s % 4 === 2) hat(t, .025); }
  } else if (P.style === 'electro'){
    if (D > 0 || e){
      const ai = M.arp[s], n = tones[ai % tones.length] + 12 * Math.floor(ai / tones.length);
      pluck(voice(0) + n, t, .085);
    }
    if (D > 0){ if (s % 4 === 2) bass(b, t, .22, .18); } else if (s === 0) bass(b, t, .24, .9);
    if (D > 1){ if (q) kick(t, .55); if (s % 4 === 2) hat(t, .06); else if (s % 2 === 1) hat(t, .02); if (s === 4 || s === 12) clap(t, .14); }
    else if (D === 1){ if (q) kick(t, .4); if (s % 4 === 2) hat(t, .04); }
    else if (s === 0 || s === 8) kick(t, .3);
    if (e && M.r[h] && S.bar % 2 === 1) osc('square', mf(mel(ci)), t, .005, .18, .03, true);
  } else if (P.style === 'musicbox'){
    if (e && M.r[h]) bell(mel(ci) + (P.oct ? 0 : 12), t, .13);
    if (s === 0) bell(b + 24, t, .1);
    if (s === 8) bell(voice(tones[1]), t, .07);
    if (s === 4 || s === 12) bell(voice(tones[2]), t, .05);
  } else if (P.style === 'chip'){
    // 8bit：矩形波のメロディと速いアルペジオ、三角波のベース、ノイズのドラム。残響なし
    if (D > 0 || e){ const n = tones[s % tones.length] + (s % 8 > 3 ? 12 : 0); osc('square', mf(voice(n) + 12), t, .002, sd * .8, .022); }
    if (e && M.r[h]) osc('square', mf(mel(ci) + (P.oct ? 0 : 12)), t, .003, sd * 1.9, .05);
    if (s % 4 === 0 || (D > 0 && s % 4 === 2)) osc('triangle', mf(b + (s % 8 === 6 ? 7 : 0)), t, .003, sd * 1.7, .22);
    if (D > 0){
      if (q){ const c = A.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(40, t + .09);
        g.gain.setValueAtTime(D > 1 ? .4 : .28, t); g.gain.exponentialRampToValueAtTime(.0001, t + .12); o.connect(g); g.connect(A.music); o.start(t); o.stop(t + .14); }
      if (s === 4 || s === 12) noise(t, .09, .1, 'highpass', 1800);
      if (D > 1 && s % 2 === 1) noise(t, .025, .04, 'highpass', 6000);
    }
  } else if (P.style === 'birds'){
    // 鳥のさえずり：拍のないやわらかい和音の上で、ときどき鳥が鳴く
    if (s === 0){ tones.forEach(n => osc('sine', mf(voice(n)), t, 1.2, sd * 17, .03, true)); osc('sine', mf(b), t, 1.2, sd * 17, .05); }
    if (D === 0){ if (Math.random() < .018) owl(t, .1); }   // 夜は鳥の代わりにフクロウ
    else if (Math.random() < (D > 1 ? .17 : .11)) bird(t + Math.random() * sd, .035 + Math.random() * .045);
    if (D > 0 && e && M.r[h] && S.bar % 4 === 3) bell(mel(ci) + 12, t, .025);
  } else if (P.style === 'country'){
    // 田舎のさえずり：静かな和音の上でカエルが鳴く。夜は遠くに虫の音も
    if (s === 0){ tones.forEach(n => osc('sine', mf(voice(n)), t, 1.2, sd * 17, .022, true)); osc('sine', mf(b), t, 1.2, sd * 17, .04); }
    if (Math.random() < .11) frog(t + Math.random() * sd, .05 + Math.random() * .05);
    if (D < 2 && Math.random() < .03) cricket(t + Math.random() * sd, .012);
  } else if (P.style === 'forest'){
    // 森のさえずり：コオロギとスズムシ
    if (s === 0){ tones.forEach(n => osc('sine', mf(voice(n)), t, 1.2, sd * 17, .02, true)); osc('sine', mf(b), t, 1.2, sd * 17, .035); }
    if (Math.random() < .1) cricket(t + Math.random() * sd, .02 + Math.random() * .02);
    if (Math.random() < .035) suzu(t + Math.random() * sd, .022 + Math.random() * .014);
  } else if (P.style === 'whistle'){
    // 口笛：口笛のメロディに、軽いつまびきと指鳴らし
    if (e && M.r[h]) whistle(mel(ci) + (P.oct ? 0 : 12), t, sd * 2.7, .1);
    if (s === 0) bass(b, t, .2, .5); if (s === 8) bass(b + 7, t, .14, .4);
    if (s === 0 || s === 6 || s === 10) tones.forEach((n, i) => pluck(voice(n), t + i * .012, .028));
    if (D > 0 && (s === 4 || s === 12)) noise(t, .03, .09, 'bandpass', 2400, 2);
  } else if (P.style === 'jazz'){
    // ジャズ：4つ刻みで歩くベース、はねたシンバル、エレピの合いの手、ピアノのメロディ
    const sw = s % 4 === 2 ? sd * .62 : 0;
    if (q){ const w = [0, tones[1], tones[2], tones[3] || 9][s / 4]; bass(b + w, t, .24, sd * 3.4); }
    if (q) hat(t, .05); if (s === 6 || s === 14) hat(t + sw, .035);
    if (D > 0 && (s === 4 || s === 12)) noise(t, .09, .035, 'highpass', 3500);
    if (D > 1 && s === 0) kick(t, .2);
    if (M.stab[s] === 'x' && e) tones.forEach((n, i) => epiano(voice(n), t + sw + i * .006, .042, .5));
    if (e && M.r[h] && S.bar % 2 === 1) piano(mel(ci), t + sw, .12, .5);
  } else {
    const tt = t + (s % 2 === 1 ? sd * .3 : 0);
    if (s === 0) tones.forEach((n, i) => epiano(voice(n), t + i * .012, .07, 1.8));
    if (s === 10 && M.fill) tones.forEach(n => epiano(voice(n), tt, .04, .9));
    if (s === 0) bass(b, t, .28, .5);
    if (s === 10) bass(b, t, .2, .3);
    if (s === 14 && M.fill) bass(b + 7, t, .14, .2);
    if (s === 0 || s === 10) kick(t, D ? .5 : .3);
    if (s === 4 || s === 12) snare(t, D ? .12 : .06);
    if (e) hat(t, D ? .035 : .018); else if (Math.random() < .3) hat(tt, .015);
    if (e && M.r[h] && S.bar % 2 === 1) epiano(mel(ci) + (P.oct ? 0 : 12), t, .06, .8);
    if (Math.random() < .25) noise(t + Math.random() * sd, .01, .02, 'highpass', 5000);
  }
}
// テンポは15の倍数に丸める。こうすると1秒が16分音符のちょうど整数個になり、毎秒の「ポッ」が必ず拍の刻みに乗る
const qbpm = mood => Math.max(60, Math.round(MOODS[mood].bpm * STYLES[state.style].tempo / 15) * 15);
// 16分の刻みを時計の秒にそろえる。S.abs は「時計の時刻×(1秒あたりの刻み数)」で、16で割った余りが小節内の位置
// 音の時計と壁時計の差。音の時計は塊で進むので1回の測定はぶれる。直近1秒ほどの測定の最大値を使うと安定する
const OFF = [];
function sampleOff(){
  const c = A.ctx; let v = c.currentTime - Date.now() / 1000;
  try{ const ts = c.getOutputTimestamp && c.getOutputTimestamp(); if (ts && ts.contextTime > 0) v = Math.max(v, ts.contextTime - (performance.timeOrigin + ts.performanceTime) / 1000); }catch(e){}
  OFF.push(v); if (OFF.length > 40) OFF.shift();
}
function wallToCtx(w){ const c = A.ctx; if (!OFF.length) sampleOff(); return w + Math.max.apply(null, OFF) - (c.outputLatency || c.baseLatency || 0); }
function align(){
  const k = S.P.bpm / 15, n = Math.ceil((Date.now() / 1000 + .07) * k);
  S.abs = n; S.next = wallToCtx(n / k); S.step = n % 16; S.bar = Math.floor(n / 16); S.beatRef = S.next - (n % 4) / k;
}
function tick(){
  const c = A.ctx; if (!c || !A.playing) return;
  sampleOff();

    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tA.t); gl.uniform1i(PV.u.u_a, 1); gl.uniform2f(PV.u.u_wres, ww, wh); gl.drawArrays(gl.TRIANGLES, 0, 6);
  }
  // グリッチは「入」なら常時、「切」でも映像をタップした瞬間だけ走る
  const glitch = glitchOn || tap > .03, u = PF.u, mono = base === 'mono', P = mono ? GREYS : PALS[pal % PALS.length];
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, cv.width, cv.height); gl.useProgram(PF.p);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tB.t); gl.uniform1i(u.u_fx, 1); gl.activeTexture(gl.TEXTURE0);
  srcU(u); gl.uniform2f(u.u_res, cv.width, cv.height); gl.uniform1f(u.u_t, now % 600); gl.uniform1f(u.u_dpr, dpr);
  gl.uniform1f(u.u_mono, mono ? 1 : 0); gl.uniform1f(u.u_look, LOOK_ID[look] || 0); gl.uniform1f(u.u_glitch, glitch ? 1 : 0);
  gl.uniform1f(u.u_burst, glitchOn ? Math.min(1.2, burst) : tap);
  gl.uniform1f(u.u_lines, lines);
  gl.uniform1f(u.u_gamma, Math.pow(2, (monoTone - .5) * 2.6));
  gl.uniform1f(u.u_grain, look === 'film' ? .085 : look === 'vivid' ? .012 : look === 'mini' ? 0 : look === 'none' || look === 'fish' ? (mono ? .04 : 0) : look === 'manga' && !mono ? .02 : .03);
  gl.uniform3f(u.u_paper, .965, .957, .933); gl.uniform3f(u.u_ink, .063, .063, .071);
  gl.uniform3fv(u.u_p0, P[0]); gl.uniform3fv(u.u_p1, P[1]); gl.uniform3fv(u.u_p2, P[2]); gl.uniform3fv(u.u_p3, P[3]);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
}

/* ───────────── 進行：映像10秒 → 時刻カード → 映像 ───────────── */
const SC_LEN = 10, CARD_LEN = 4, WIPE = .55;
// 時刻カードは2枚を交互に使い、1秒ごとに新しい1枚が上下左右のどこかから入ってくる
const cards = [$('cardA'), $('cardB')], EASE = 'cubic-bezier(.7,0,.2,1)';
const HIDE = { l:'inset(0 100% 0 0)', r:'inset(0 0 0 100%)', t:'inset(0 0 100% 0)', b:'inset(100% 0 0 0)' };
let top = 0, inv = false, horiz = Math.random() < .5, hs = Math.random() < .5 ? 0 : 1, vs = Math.random() < .5 ? 0 : 1;
// 動きは「左右」と「上下」を交互にし、同じ向きの中でも側を交互にする（上→右→下→左…のように一巡する）
const side = () => { horiz = !horiz; if (horiz){ hs = 1 - hs; return 'lr'[hs]; } vs = 1 - vs; return 'tb'[vs]; };
function clip(el, v, anim){
  el.style.transition = anim && !reduce ? 'clip-path .42s ' + EASE + ', -webkit-clip-path .42s ' + EASE : 'none';
  el.style.webkitClipPath = v; el.style.clipPath = v;
}
function cardIn(text){
  const prev = cards[top]; top = 1 - top; inv = !inv; const el = cards[top];
  el.querySelector('.ctime').textContent = text; el.classList.toggle('inv', inv);
  prev.style.zIndex = 3; el.style.zIndex = 4;
  clip(el, HIDE[side()], false); void el.offsetWidth; clip(el, 'inset(0 0 0 0)', true);
  cardOn = true;
}
function cardOut(){
  if (!cardOn) return; cardOn = false;
  clip(cards[1 - top], HIDE.l, false); clip(cards[top], HIDE[side()], true);
  pal++; if (!reduce) burst = Math.max(burst, .8);
}
function cardsOff(){ cards.forEach(el => clip(el, HIDE.l, false)); cardOn = false; }
let sceneT0 = 0, cardOn = false, burst = 0, tap = 0, pal = 0, lines = 0, lastT = 0, hold = false;
const p2 = n => (n < 10 ? '0' : '') + n, WD = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
let lastSec = -1, lastMin = -1, lastHour = -1;
function tickClock(){
  const d = new Date(), s = d.getSeconds(); if (s === lastSec) return;
  lastSec = s; const m = d.getMinutes(), h = d.getHours();
  // 0秒の長い音のときはカードを出さず、1〜5秒に毎秒1枚ずつ。6秒になった瞬間に映像へ戻り、次の1秒まで映像
  if (running && !hold){ const k = s % 10; if (k >= 1 && k <= 5) cardIn(p2(h) + ' ' + p2(m) + ' ' + p2(s)); else if (k === 6) cardOut(); }
  if (!reduce && glitchOn) burst = Math.max(burst, s % 10 === 0 ? 1.1 : .8);   // グリッチONのときは、毎秒の音に合わせて映像を乱す
  if (m !== lastMin){
    const ds = d.getFullYear() + '.' + p2(d.getMonth() + 1) + '.' + p2(d.getDate()) + ' ' + WD[d.getDay()];
    const pt = placeText();
    document.querySelectorAll('.csub').forEach(el => { el.textContent = (pt ? pt + ' / ' : '') + ds; }); $('tagDate').textContent = ds;
    $('srtime').textContent = LANG === 'ja' ? 'AR Clock ' + h + '時' + m + '分' : 'AR Clock ' + h + ':' + p2(m);
    if (lastMin !== -1 && !reduce) burst = 1;
  }
  if (h !== lastHour){ if (lastHour !== -1) S.dirty = true; updateCaption(); }
  // 時報：毎秒短い音、0・10・20…秒に長い音。BGMが鳴っている間は、拍と和音に合わせて音の側で鳴らす
  if (state.chime && running && !(A.playing && A.ctx && A.ctx.state === 'running')){ if (s % 10 === 0) pong(); else pip(TONE_PIP, .05, .28); }
  lastMin = m; lastHour = h;
}
function frame(ms){
  requestAnimationFrame(frame);
  const now = ms / 1000, dt = Math.min(.1, now - lastT || .016); lastT = now;
  tickClock();
  burst *= Math.exp(-dt * 4); tap *= Math.exp(-dt * 4); lines *= Math.exp(-dt * 1.6);
  if (!gl) return;
  render(now);
}
cv.addEventListener('click', () => {
  if (performance.now() - (A.unlockedAt || -1e9) < 700){ say(tr('audioBack')); return; }   // 止められていた音を戻すためのタップは、それだけに使う
  if (tapTimer){ clearTimeout(tapTimer); tapTimer = null; burst = 1; tap = 1; return; }
  tapTimer = setTimeout(() => { tapTimer = null; setFrozen(!frozen); }, 270);
});
cv.addEventListener('webglcontextlost', ev => { ev.preventDefault(); gl = null; });
cv.addEventListener('webglcontextrestored', () => { initGL(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if ((src.kind === 'camera' || src.kind === 'file') && !frozen) video.play().catch(() => {});
  stall = 1; watchdog();
  if (running && navigator.wakeLock && navigator.wakeLock.request && !wakeLock) navigator.wakeLock.request('screen').then(w => { wakeLock = w; w.addEventListener('release', () => { wakeLock = null; }); }).catch(() => {});
});
window.__ar = { set(b0, l0, g0, b, l, p){ base = b0; look = l0; glitchOn = !!g0; pal = p || 0; hold = true; running = true; startBox.hidden = true; ask.hidden = true; cardsOff(); syncSrc(); clearInterval(window.__iv); window.__iv = setInterval(() => { burst = b || 0; lines = l || 0; }, 16); } };

applyLang();
if (!initGL()){ errKey = 'errGL'; msg.textContent = tr('errGL'); }
if (labelsOn) locate();
syncUI(); syncSrc(); wake(); tickClock();
// 前にカメラを許可済みなら、開いたときにそのまま起動する
if (navigator.permissions && navigator.permissions.query) navigator.permissions.query({ name:'camera' }).then(r => { if (r.state === 'granted') startCamera(); }).catch(() => {});
requestAnimationFrame(frame);
})();
