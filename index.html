<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AR Clock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: one manga panel filling the phone screen, showing the camera through a filter; every 10 seconds a flat time card wipes across. All controls live in a sheet that slides up from the bottom. Single black-and-white look by design. */
:root{
  --paper:#f6f4ee; --ink:#101012; --mute:#66666c;
  --font-d:'Archivo','Helvetica Neue',Arial,sans-serif;
  --font-u:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-u); font-weight:700; font-size:14px; overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; -webkit-text-size-adjust:100%;
}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%)}

/* 画面いっぱいのコマ。余白はノッチやホームバーの分だけ取る */
.app{position:fixed; inset:0; display:flex; background:var(--paper);
  padding:max(8px,var(--st)) max(8px,var(--sr)) max(8px,var(--sb)) max(8px,var(--sl))}
@supports (height:100dvh){ .app{bottom:auto; height:100dvh} }
.stage{position:relative; flex:1 1 auto; min-width:0; min-height:0; border:3px solid var(--ink); background:var(--ink); overflow:hidden}
#gl{position:absolute; inset:0; width:100%; height:100%; display:block}
#vid{position:absolute; left:0; top:0; width:2px; height:2px; opacity:0; pointer-events:none}
.tag{position:absolute; z-index:1; background:var(--paper); color:var(--ink); border:2px solid var(--ink); padding:3px 8px;
  font-family:var(--font-d); font-weight:800; font-size:11px; letter-spacing:.16em; pointer-events:none; font-variant-numeric:tabular-nums}
.tag.tl{left:8px; top:8px} .tag.br{right:8px; bottom:8px} .tag.bl{left:8px; bottom:8px; font-family:var(--font-u); letter-spacing:.06em}

button, label.btn{
  font:inherit; font-size:14px; color:var(--ink); background:var(--paper); margin:0;
  border:2px solid var(--ink); border-radius:0; padding:10px 14px; min-height:44px; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; text-align:center;
}
button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
button:focus-visible, input:focus-visible, label.btn:focus-within{outline:2px dashed var(--ink); outline-offset:3px}

.start{position:absolute; z-index:2; left:50%; top:50%; transform:translate(-50%,-50%); width:min(320px,calc(100% - 32px));
  background:var(--paper); border:3px solid var(--ink); box-shadow:6px 6px 0 var(--ink); padding:18px; display:flex; flex-direction:column; gap:10px}
.start h2{margin:0; font-family:var(--font-d); font-weight:800; font-size:22px; letter-spacing:.08em}
.start p{margin:0; font-size:13px; font-weight:500; line-height:1.6}
.start .err{font-weight:700}
.start .err:empty{display:none}
.start button, .start label.btn{width:100%}
.start .primary{background:var(--ink); color:var(--paper)}

.card{position:fixed; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  background:var(--paper); color:var(--ink); pointer-events:none; padding-inline:16px; text-align:center;
  -webkit-clip-path:inset(0 100% 0 0); clip-path:inset(0 100% 0 0)}
.card.inv{background:var(--ink); color:var(--paper)}
.card.in{-webkit-clip-path:inset(0 0 0 0); clip-path:inset(0 0 0 0); transition:clip-path .55s cubic-bezier(.7,0,.2,1), -webkit-clip-path .55s cubic-bezier(.7,0,.2,1)}
.card.out{-webkit-clip-path:inset(0 0 0 100%); clip-path:inset(0 0 0 100%); transition:clip-path .55s cubic-bezier(.7,0,.2,1), -webkit-clip-path .55s cubic-bezier(.7,0,.2,1)}
.time{font-family:var(--font-d); font-weight:800; font-size:clamp(44px,15vw,84px); letter-spacing:.05em; line-height:1; font-variant-numeric:tabular-nums}
.sub{font-family:var(--font-d); font-weight:600; font-size:12px; letter-spacing:.26em; text-indent:.26em}
.sub.dimmed{opacity:.55; letter-spacing:.2em}

/* 設定ボタン：右上に1つだけ。しばらく触らないと薄くなる */
#menu{position:fixed; z-index:5; top:calc(max(8px,var(--st)) + 11px); right:calc(max(8px,var(--sr)) + 11px);
  min-height:44px; padding:8px 14px; font-family:var(--font-d); font-weight:800; font-size:12px; letter-spacing:.14em; transition:opacity .6s}
.dim #menu{opacity:.4}

/* 下からせり上がるシート */
.shade{position:fixed; inset:0; z-index:6; cursor:pointer; background:rgba(16,16,18,.45); opacity:0; visibility:hidden; transition:opacity .25s, visibility 0s .25s}
.shade.open{opacity:1; visibility:visible; transition:opacity .25s}
.sheet{position:fixed; z-index:7; left:0; right:0; bottom:0; max-height:82%; display:flex; flex-direction:column;
  background:var(--paper); border-top:3px solid var(--ink); transform:translateY(102%); visibility:hidden;
  transition:transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s .3s}
@supports (height:100dvh){ .sheet{bottom:auto; top:100dvh; max-height:82dvh; transform:translateY(2%)} .sheet.open{transform:translateY(-100%)} }
.sheet.open{visibility:visible; transition:transform .3s cubic-bezier(.2,.8,.2,1)}
@supports not (height:100dvh){ .sheet.open{transform:none} }
.sheet-head{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px max(16px,var(--sr)) 10px max(16px,var(--sl)); border-bottom:2px solid var(--ink)}
.sheet-head h2{margin:0; font-family:var(--font-d); font-weight:800; font-size:14px; letter-spacing:.16em}
.sheet-body{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:18px;
  padding:16px max(16px,var(--sr)) calc(max(16px,var(--sb)) + 28px) max(16px,var(--sl))}
.grp{display:flex; flex-direction:column; gap:8px; min-width:0}
.grp h3{margin:0; font-family:var(--font-d); font-weight:600; font-size:11px; letter-spacing:.14em}
.seg{display:flex; flex-wrap:wrap; gap:8px}
.seg.two > *{flex:1 1 0}
.note{margin:0; font-size:12px; font-weight:500; color:var(--mute); line-height:1.5}
input[type=range]{width:100%; height:36px; margin:0; accent-color:var(--ink)}
@media (prefers-reduced-motion: reduce){ .card.in,.card.out,.sheet,.sheet.open,.shade,.shade.open{transition:none} }
</style>

</head>
<body>
<h1 class="sr" id="srtime">AR Clock</h1>
<input type="file" id="file" class="sr" accept="image/*,video/*" tabindex="-1">

<div class="app">
  <main class="stage" id="stage">
    <canvas id="gl" aria-label="フィルタをかけたカメラ映像"></canvas>
    <video id="vid" playsinline muted loop></video>
    <div class="tag tl" id="tagPlace">AR CLOCK</div>
    <div class="tag br" id="tagDate"></div>
    <div class="tag bl" id="tagSrc">サンプル映像</div>
    <div class="start" id="start">
      <h2>AR CLOCK</h2>
      <p>目の前の景色をマンガ調にして、10秒ごとに時刻を出す時計です。</p>
      <button type="button" id="camStart" class="primary">カメラを起動</button>
      <label class="btn" for="file">写真・動画を選ぶ</label>
      <button type="button" id="demoStart">サンプル映像で見る</button>
      <p class="err" id="msg" role="status"></p>
    </div>
    <div class="start" id="ask" hidden>
      <h2>音が鳴ります</h2>
      <p>BGMを流しますか。あとから「設定」でいつでも変えられます。</p>
      <button type="button" id="soundYes" class="primary">流す</button>
      <button type="button" id="soundNo">流さない</button>
    </div>
  </main>
</div>

<div class="card" id="card">
  <div class="time" id="ctime">-- -- --</div>
  <div class="sub" id="csub"></div>
  <div class="sub dimmed" id="cmood"></div>
</div>

<button type="button" id="menu" aria-expanded="false" aria-controls="sheet">設定</button>
<div class="shade" id="shade"></div>
<section class="sheet" id="sheet" aria-label="設定">
  <div class="sheet-head"><h2>設定</h2><button type="button" id="close">閉じる</button></div>
  <div class="sheet-body">
    <div class="grp">
      <h3>音</h3>
      <div class="seg two">
        <button type="button" id="play">▶ 音を鳴らす</button>
        <button type="button" id="chime" aria-pressed="false">時報</button>
      </div>
    </div>
    <div class="grp">
      <h3>フィルタ</h3>
      <div class="seg" id="segFx">
        <button type="button" id="fx-manga" data-v="manga">マンガ</button>
        <button type="button" id="fx-both" data-v="both">マンガ＋グリッチ</button>
        <button type="button" id="fx-glitch" data-v="glitch">グリッチ</button>
        <button type="button" id="fx-mono" data-v="mono">モノクロ</button>
      </div>
      <p class="note">映像をタップすると、その場でグリッチが走ります。</p>
    </div>
    <div class="grp">
      <h3>映像</h3>
      <div class="seg" id="segSrc">
        <button type="button" id="src-env" data-v="environment">外側カメラ</button>
        <button type="button" id="src-user" data-v="user">内側カメラ</button>
        <label class="btn" for="file">写真・動画を選ぶ</label>
      </div>
    </div>
    <div class="grp">
      <h3>音色</h3>
      <div class="seg" id="segStyle">
        <button type="button" id="st-piano" data-v="piano">ピアノ</button>
        <button type="button" id="st-electro" data-v="electro">エレクトロ</button>
        <button type="button" id="st-musicbox" data-v="musicbox">オルゴール</button>
        <button type="button" id="st-lofi" data-v="lofi">ローファイ</button>
      </div>
    </div>
    <div class="grp">
      <h3>時間帯</h3>
      <div class="seg" id="segMood">
        <button type="button" id="md-auto" data-v="auto">自動</button>
        <button type="button" id="md-morning" data-v="morning">朝</button>
        <button type="button" id="md-day" data-v="day">昼</button>
        <button type="button" id="md-evening" data-v="evening">夕</button>
        <button type="button" id="md-night" data-v="night">夜</button>
      </div>
      <p class="note">自動にすると、朝は速く明るく、夜は遅くやわらかく変わります。</p>
    </div>
    <div class="grp">
      <h3><label for="vol">音量</label></h3>
      <input type="range" id="vol" min="0" max="1" step="0.01">
    </div>
  </div>
</section>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('arclock.' + k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('arclock.' + k, v); }catch(e){} }
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pick = a => a[Math.random() * a.length | 0];

const state = {
  style: store.get('style', 'piano'),
  mood: store.get('mood', 'auto'),
  chime: store.get('chime', '1') === '1',
  vol: Math.min(1, Math.max(0, parseFloat(store.get('vol', '0.7')) || 0))
};

/* ───────────── 音：その場で生成するエンドレスBGM ───────────── */
const MOODS = {
  morning:{ label:'MORNING', key:62, bpm:126, cut:11000, drums:2, oct:12, send:.16,
    prog:[[0,'M'],[7,'M'],[9,'m7'],[5,'M7'],[0,'M'],[4,'m7'],[5,'M7'],[7,'sus']] },
  day:{ label:'DAYTIME', key:55, bpm:118, cut:8500, drums:2, oct:12, send:.18,
    prog:[[5,'M7'],[7,'M'],[4,'m7'],[9,'m'],[5,'M7'],[7,'M'],[0,'M'],[0,'M7']] },
  evening:{ label:'EVENING', key:60, bpm:100, cut:4200, drums:1, oct:0, send:.24,
    prog:[[9,'m7'],[5,'M7'],[0,'M7'],[7,'M'],[9,'m7'],[5,'M7'],[2,'m7'],[7,'sus']] },
  night:{ label:'NIGHT', key:63, bpm:76, cut:1900, drums:0, oct:0, send:.32,
    prog:[[0,'M7'],[9,'m7'],[5,'M7'],[7,'sus'],[2,'m7'],[7,'7'],[0,'M7'],[0,'M7']] }
};
const STYLES = {
  piano:{ label:'ピアノ', tempo:1 }, electro:{ label:'エレクトロ', tempo:1.04 },
  musicbox:{ label:'オルゴール', tempo:.8 }, lofi:{ label:'ローファイ', tempo:.82 }
};
if (!STYLES[state.style]) state.style = 'piano';
if (state.mood !== 'auto' && !MOODS[state.mood]) state.mood = 'auto';
const CH = { M:[0,4,7], m:[0,3,7], M7:[0,4,7,11], m7:[0,3,7,10], sus:[0,5,7], '7':[0,4,7,10] };
const PENTA = [0,2,4,7,9,12,14,16,19,21];
const ARPS = [
  [0,1,2,3,2,1,2,3,0,1,2,4,2,1,2,3],
  [0,2,1,3,2,4,3,2,0,2,1,3,2,4,5,4],
  [0,1,2,0,1,2,3,1,2,3,4,2,3,2,1,0],
  [3,2,1,0,3,2,1,0,4,3,2,1,4,3,2,1]
];
const STABS = ['x..x..x.x..x..x.', 'x.x...x.x.x...x.', 'x..x.x..x..x.x..', '..x...x...x..x..'];

const autoMood = h => h >= 5 && h < 10 ? 'morning' : h < 17 && h >= 10 ? 'day' : h >= 17 && h < 22 ? 'evening' : 'night';
const currentMood = () => state.mood === 'auto' ? autoMood(new Date().getHours()) : state.mood;
const mf = m => 440 * Math.pow(2, (m - 69) / 12);

const A = { ctx:null, playing:false, timer:null };
const S = { step:0, bar:0, next:0, P:null, motif:null, beatRef:0, dirty:true };

function initAudio(){
  if (A.ctx){ if (A.ctx.state === 'suspended') A.ctx.resume(); return true; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  const c = A.ctx = new AC();
  A.out = c.createGain(); A.out.gain.value = state.vol;
  A.comp = c.createDynamicsCompressor(); A.comp.threshold.value = -14; A.comp.ratio.value = 4;
  A.comp.connect(A.out); A.out.connect(c.destination);
  A.music = c.createGain(); A.music.gain.value = 0;
  A.lp = c.createBiquadFilter(); A.lp.type = 'lowpass'; A.lp.frequency.value = 8000; A.lp.Q.value = .3;
  A.music.connect(A.lp); A.lp.connect(A.comp);
  A.send = c.createGain(); A.send.gain.value = .2;
  A.delay = c.createDelay(1.5); A.delay.delayTime.value = .38;
  A.fb = c.createGain(); A.fb.gain.value = .34;
  A.dlp = c.createBiquadFilter(); A.dlp.type = 'lowpass'; A.dlp.frequency.value = 2400;
  A.send.connect(A.delay); A.delay.connect(A.dlp); A.dlp.connect(A.fb); A.fb.connect(A.delay); A.dlp.connect(A.music);
  const n = c.sampleRate, buf = c.createBuffer(1, n, n), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  A.nbuf = buf;
  A.chime = c.createGain(); A.chime.gain.value = .9; A.chime.connect(A.comp);
  return true;
}
function osc(type, f, t, a, d, peak, wet, dest){
  const c = A.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(peak, .0002), t + a);
  g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
  o.connect(g); g.connect(dest || A.music); if (wet) g.connect(A.send);
  o.start(t); o.stop(t + a + d + .05);
}
function noise(t, d, v, type, freq, q){
  const c = A.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = A.nbuf; f.type = type; f.frequency.value = freq; f.Q.value = q || .7;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f); f.connect(g); g.connect(A.music);
  s.start(t, Math.random() * .5); s.stop(t + d + .02);
}
function kick(t, v){
  const c = A.ctx, o = c.createOscillator(), g = c.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(46, t + .11);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
  o.connect(g); g.connect(A.music); o.start(t); o.stop(t + .32);
}
const hat = (t, v) => noise(t, .035, v, 'highpass', 7500);
const rim = (t, v) => { noise(t, .03, v, 'bandpass', 2200, 3); osc('triangle', 900, t, .001, .03, v * .5); };
const clap = (t, v) => noise(t, .11, v, 'bandpass', 1500, 1.2);
const snare = (t, v) => { noise(t, .14, v, 'bandpass', 1900, .8); osc('triangle', 190, t, .001, .08, v * .6); };
const bass = (m, t, v, d) => { const f = mf(m); osc('triangle', f, t, .008, d, v); osc('sine', f, t, .008, d, v * .6); };
const piano = (m, t, v, d) => { const f = mf(m); osc('triangle', f, t, .004, d, v, true); osc('sine', f * 2, t, .004, d * .4, v * .3); osc('sine', f * 1.004, t, .004, d, v * .5); };
const bell = (m, t, v) => { const f = mf(m); osc('sine', f, t, .003, 1.6, v, true); osc('sine', f * 3.01, t, .003, .35, v * .22); osc('sine', f * 5.4, t, .002, .12, v * .1); };
function pluck(m, t, v){
  const c = A.ctx, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
  o.type = 'sawtooth'; o.frequency.value = mf(m); f.type = 'lowpass'; f.Q.value = 4;
  f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(350, t + .18);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + .22);
  o.connect(f); f.connect(g); g.connect(A.music); g.connect(A.send); o.start(t); o.stop(t + .25);
}
function epiano(m, t, v, d){
  const c = A.ctx, f = mf(m), car = c.createOscillator(), mod = c.createOscillator(), mg = c.createGain(), g = c.createGain();
  car.frequency.value = f; mod.frequency.value = f;
  mg.gain.setValueAtTime(f * 1.6, t); mg.gain.exponentialRampToValueAtTime(f * .15, t + .5);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  mod.connect(mg); mg.connect(car.frequency); car.connect(g); g.connect(A.music); g.connect(A.send);
  car.start(t); mod.start(t); car.stop(t + d + .05); mod.stop(t + d + .05);
}

function newMotif(){
  const r = [], c = []; let i = 2 + (Math.random() * 3 | 0);
  for (let k = 0; k < 8; k++){
    r.push(k === 0 || Math.random() < .6);
    i = Math.max(0, Math.min(7, i + pick([-2,-1,-1,0,1,1,2])));
    c.push(i);
  }
  S.motif = { r, c, arp:pick(ARPS), stab:pick(STABS), fill:Math.random() < .5 };
}
function mutateMotif(){
  const M = S.motif;
  for (let n = 0; n < 2; n++){
    const k = 1 + (Math.random() * 7 | 0);
    M.r[k] = Math.random() < .6;
    M.c[k] = Math.max(0, Math.min(7, M.c[k] + pick([-1, 1, 2, -2])));
  }
  if (Math.random() < .4) M.stab = pick(STABS);
  if (Math.random() < .4) M.arp = pick(ARPS);
  M.fill = Math.random() < .5;
}
function params(){
  const mood = currentMood(), M = MOODS[mood];
  return { mood, style:state.style, key:M.key, bpm:Math.round(M.bpm * STYLES[state.style].tempo),
    cut:M.cut, drums:M.drums, oct:M.oct, send:M.send, prog:M.prog };
}
function applyParams(t){
  const np = params(), old = S.P;
  S.P = np; S.beatRef = t; S.dirty = false;
  A.lp.frequency.setTargetAtTime(np.cut, t, .25);
  A.send.gain.setTargetAtTime(np.send, t, .25);
  A.delay.delayTime.setTargetAtTime(60 / np.bpm * .75, t, .2);
  if (!old || old.style !== np.style || !S.motif) newMotif();
  updateCaption();
}
function scheduleStep(s, t){

  else if (src.kind === 'image'){ if (!stillDirty) return; stillDirty = false; el = still; w = still.width; h = still.height; }
  if (el === demo) drawDemo(t);
  try{ gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, el); srcW = w; srcH = h; }catch(e){}
}

/* ───────────── 進行：映像10秒 → 時刻カード → 映像 ───────────── */
const SC_LEN = 10, CARD_LEN = 4, WIPE = .55;
const card = $('card');
let sceneT0 = 0, cardT0 = null, opening = false, burst = 0, lines = 0, lastT = 0, hold = false;
const p2 = n => (n < 10 ? '0' : '') + n, WD = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
let lastSec = -1, lastMin = -1, lastHour = -1, place = '';
try{ place = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').split('/').pop().replace(/_/g, ' ').toUpperCase(); }catch(e){}
if (place) $('tagPlace').textContent = place;
function tickClock(){
  const d = new Date(), s = d.getSeconds(); if (s === lastSec) return;
  lastSec = s; const m = d.getMinutes(), h = d.getHours();
  $('ctime').textContent = p2(h) + ' ' + p2(m) + ' ' + p2(s);
  if (!reduce && fx !== 'mono') burst = Math.max(burst, .3);
  if (m !== lastMin){
    const ds = d.getFullYear() + '.' + p2(d.getMonth() + 1) + '.' + p2(d.getDate()) + ' ' + WD[d.getDay()];
    $('csub').textContent = (place ? place + ' / ' : '') + ds; $('tagDate').textContent = ds;
    $('srtime').textContent = 'AR Clock ' + h + '時' + m + '分';
    if (lastMin !== -1 && !reduce){ burst = 1; lines = 1; }
  }
  if (h !== lastHour){ if (lastHour !== -1) S.dirty = true; updateCaption(); }
  if (state.chime){ if (m === 59 && s >= 57) pip(440, .12, .32); if (m === 0 && s === 0) pong(); }
  lastMin = m; lastHour = h;
}
function frame(ms){
  requestAnimationFrame(frame);
  const now = ms / 1000, dt = Math.min(.1, now - lastT || .016); lastT = now;
  tickClock();
  if (running && !hold){
    if (cardT0 !== null){
      const a = now - cardT0;
      if (!opening && a >= CARD_LEN - WIPE){ opening = true; card.classList.remove('in'); card.classList.add('out'); if (!reduce) burst = Math.max(burst, .8); }
      if (a >= CARD_LEN + .05){ cardT0 = null; sceneT0 = now; card.classList.remove('out'); }
    } else if (now - sceneT0 >= SC_LEN){
      cardT0 = now; opening = false; card.classList.toggle('inv'); void card.offsetWidth; card.classList.add('in');
    }
  }
  burst *= Math.exp(-dt * 4); lines *= Math.exp(-dt * 1.6);
  if (!gl) return;
  layout(); upload(now);
  const glitch = fx === 'glitch' || fx === 'both';
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(U.u_res, cv.width, cv.height); gl.uniform2f(U.u_src, srcW, srcH);
  gl.uniform1f(U.u_t, now % 600); gl.uniform1f(U.u_dpr, dpr);
  gl.uniform1f(U.u_manga, fx === 'manga' || fx === 'both' ? 1 : 0); gl.uniform1f(U.u_glitch, glitch ? 1 : 0);
  gl.uniform1f(U.u_burst, glitch ? Math.min(1.2, burst + (A.playing && !reduce ? beatPulse() * .16 : 0)) : 0);
  gl.uniform1f(U.u_lines, lines); gl.uniform1f(U.u_mirror, src.kind === 'camera' && src.mirror ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
}
cv.addEventListener('pointerdown', () => { burst = 1; });
cv.addEventListener('webglcontextlost', ev => { ev.preventDefault(); gl = null; });
cv.addEventListener('webglcontextrestored', () => { initGL(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (src.kind === 'camera' || src.kind === 'file') video.play().catch(() => {});
  if (running && navigator.wakeLock && navigator.wakeLock.request && !wakeLock) navigator.wakeLock.request('screen').then(w => { wakeLock = w; w.addEventListener('release', () => { wakeLock = null; }); }).catch(() => {});
});
window.__ar = { set(mode, b, l){ fx = mode; hold = true; running = true; startBox.hidden = true; ask.hidden = true; card.className = 'card'; syncSrc(); setInterval(() => { burst = b || 0; lines = l || 0; }, 16); } };

if (!initGL()) msg.textContent = 'このブラウザではWebGLを使えないため、映像を表示できません。';
syncUI(); syncSrc(); wake(); tickClock();
// 前にカメラを許可済みなら、開いたときにそのまま起動する
if (navigator.permissions && navigator.permissions.query) navigator.permissions.query({ name:'camera' }).then(r => { if (r.state === 'granted') startCamera(); }).catch(() => {});
requestAnimationFrame(frame);
})();
</script>
